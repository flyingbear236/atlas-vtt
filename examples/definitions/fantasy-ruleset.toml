schema_version = 1

[ruleset]
id = "fantasy-core"
name = "Fantasy Core"
version = "1.0.0"

[stats.strength_mod]
name = "Модификатор силы"
type = "integer"
default = 0

[stats.dexterity_mod]
name = "Модификатор ловкости"
type = "integer"
default = 0

[stats.hp]
name = "Здоровье"
type = "integer"
default = 1

[stats.speed]
name = "Скорость"
type = "number"
default = 6.0

[stats.alive]
name = "Жив"
type = "boolean"
default = true

[stats.motto]
name = "Девиз"
type = "string"
default = ""

[actions.sword_attack]
name = "Удар мечом"
description = "Проверка попадания и отдельный бросок урона."
tags = ["attack", "melee"]

[[actions.sword_attack.rolls]]
id = "attack"
name = "Попадание"
count = 1
sides = 20
modifier_stat = "strength_mod"

[[actions.sword_attack.rolls]]
id = "damage"
name = "Урон"
count = 1
sides = 8
modifier_stat = "strength_mod"

[actions.dodge]
name = "Уклонение"
description = "Проверка ловкости."
tags = ["defence"]

[[actions.dodge.rolls]]
id = "check"
name = "Проверка"
count = 1
sides = 20
modifier_stat = "dexterity_mod"

[presets.goblin]
name = "Гоблин"
kind = "monster"
actions = ["sword_attack", "dodge"]

[presets.goblin.stats]
strength_mod = 1
dexterity_mod = 2
hp = 7
speed = 6.0
alive = true
motto = "Бери всё блестящее"

[presets.knight]
name = "Рыцарь"
kind = "npc"
actions = ["sword_attack", "dodge"]

[presets.knight.stats]
strength_mod = 3
dexterity_mod = 0
hp = 24
speed = 5.0
alive = true
motto = "Честь прежде всего"
